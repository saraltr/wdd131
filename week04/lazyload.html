<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazyload Images</title>
    <link rel="stylesheet" href="styles/base.css">
    <script src="scripts/lazyload.js" defer></script>
</head>

<body>
    <main>
        <header>
            <h1>Lazyload Images</h1>
        </header>

        <img src="https://picsum.photos/400/650" alt="Random image" loading="lazy" width="400" height="650">
        <img src="https://picsum.photos/400/650?grayscale" alt="Grayscale image" loading="lazy" width="400"
            height="650">
        <img src="https://picsum.photos/400/700" alt="Random image" loading="lazy" width="400" height="700">
        <img src="https://picsum.photos/400/700?grayscale" alt="Grayscale image" loading="lazy" width="400"
            height="700">
        <img src="https://picsum.photos/400/750" alt="Random image" loading="lazy" width="400" height="750">
        <img src="https://picsum.photos/400/750?grayscale" alt="Grayscale image" loading="lazy" width="400"
            height="750">
    </main>

    <footer>
        <p>&copy; Sara Latorre</p>
    </footer>
</body>

</html>
